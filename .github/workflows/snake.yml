name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: Debug – Verify PAT secret
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ GH_PAT secret is EMPTY or not set!"
            exit 1
          else
            echo "✅ GH_PAT secret is set (length: ${#TOKEN})"
          fi
        env:
          TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit and push using PAT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update snake animation"
            # Push directly with PAT embedded in URL
            git push https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git HEAD:main
          fi
        env:
          TOKEN: ${{ secrets.GH_PAT }}
