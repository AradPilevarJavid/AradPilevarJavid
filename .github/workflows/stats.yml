name: Generate Stats SVGs
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout github-readme-stats (build dependency, not a fork)
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          ref: master
          path: grs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: grs
        run: npm ci

      - name: Start local stats server
        working-directory: grs
        env:
          PAT_1: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          npm start &
          npx wait-on http://localhost:9000 --timeout 60000

      - name: Fetch stats SVGs
        run: |
          curl -sf "http://localhost:9000/api?username=${{ github.repository_owner }}&show_icons=true&theme=dark&line_height=40" -o SVGs/stats.svg
          curl -sf "http://localhost:9000/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=dark" -o SVGs/top-langs.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SVGs/stats.svg SVGs/top-langs.svg
          git diff --staged --quiet || git commit -m "Update stats SVGs"
          git push
