name: Regenerate profile assets

on:
  push:
    branches: [main]
    paths:
      - "assets/*.json"
      - "scripts/**"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate banner
        run: python scripts/generate_banner.py

      - name: Generate radar charts
        run: python scripts/generate_radar.py

      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: regenerate profile assets"
          git push
